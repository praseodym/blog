# The URL the site will be built for
base_url = "https://www.praseodym.net/blog"

# The site title and description; used in feeds by default.
title = "praseodym.net/blog"
description = ""

# The default language; used in feeds.
default_language = "en"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to generate a feed file for the site
generate_feeds = true

# The filenames to use for the feeds. Used as the template filenames, too.
# Defaults to "atom.xml", which has a built-in template that renders an Atom 1.0 feed.
# There is also a built-in template "rss.xml" that renders an RSS 2.0 feed.
feed_filenames = ["feed.xml"]

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

# Configuration for the Markdown rendering
[markdown]

# Syntax highlighting options
[markdown.highlighting]
highlight_code = true
theme = "solarized-dark"

# Social media and other links
[extra.footer_links]
github = "praseodym"
twitter = "praseodym"
rss = true  # Enable RSS icon in footer
